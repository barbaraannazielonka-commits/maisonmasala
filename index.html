<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maison Masala – Restaurant English</title>
<style>
:root{--wine:#7a1f2b;--saffron:#f2a900;--cream:#fff8ec;--ink:#2b2118;--green:#2e7d4f;--red:#b3261e;--card:#ffffff;--line:#ecdcc3}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:linear-gradient(180deg,#fff3dc 0,#fff8ec 220px);color:var(--ink);font-size:18px;line-height:1.55}
body.easy{font-family:Verdana,Tahoma,sans-serif;letter-spacing:.03em;word-spacing:.12em;line-height:1.85}
header{background:var(--wine);color:#fff;padding:12px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-bottom:5px solid var(--saffron)}
header h1{margin:0;font-size:1.25rem;font-family:Georgia,serif}
header h1 small{display:block;font-size:.72rem;font-family:inherit;opacity:.85;font-weight:400}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools button{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:6px 14px;font:inherit;font-size:.82rem;cursor:pointer}
.tools button[aria-pressed=true]{background:var(--saffron);color:#3b2600;border-color:var(--saffron)}
main{max-width:820px;margin:0 auto;padding:18px}
.progress{height:10px;background:#f0e2c8;border-radius:99px;overflow:hidden;margin:2px 0 6px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--saffron),var(--wine));width:0;transition:width .4s}
.meta{display:flex;justify-content:space-between;font-size:.82rem;color:#7a6650;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 6px 18px rgba(122,31,43,.07)}
.mission{font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--wine);font-weight:700;margin-bottom:10px}
h2{font-family:Georgia,serif;margin:.2em 0 .4em;color:var(--wine)}
.bubble{display:flex;gap:14px;align-items:flex-start;background:#fff3dc;border-radius:16px;padding:14px 16px;margin-bottom:14px}
.av{font-size:2rem;line-height:1}
.who{font-weight:700;font-size:.85rem;color:var(--wine)}
.say{margin:.2em 0;font-size:1.08rem}
.no{display:none;margin:.3em 0 0;color:#5b4b3a;font-size:.92rem;border-top:1px dashed #d8c3a0;padding-top:6px}
body.hint .no{display:block}
.prompt{font-weight:700;margin:6px 0 10px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;text-align:left;align-items:flex-start;width:100%;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;cursor:pointer;color:inherit;transition:transform .08s,border-color .15s}
.opt:hover:not(:disabled){border-color:var(--saffron);transform:translateY(-1px)}
.opt:focus-visible,.btn:focus-visible,.pair:focus-visible{outline:3px solid #1b6ac9;outline-offset:2px}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;background:#f6e8cd;font-weight:700;display:grid;place-items:center;font-size:.85rem}
.opt:disabled{cursor:default}
.opt.sel.good{border-color:var(--green);background:#eaf6ee}
.opt.sel.mid{border-color:var(--saffron);background:#fff6df}
.opt.sel.bad{border-color:var(--red);background:#fdecea}
.opt.best:not(.sel){border-color:var(--green);border-style:dashed}
.fb{margin-top:14px;display:none;border-left:6px solid var(--saffron);background:#fffaf0;border-radius:10px;padding:12px 14px}
.fb.show{display:block}
.fb.good{border-color:var(--green)}.fb.bad{border-color:var(--red)}
.fb .pts{font-weight:800}
.say-aloud{margin-top:8px;font-size:.9rem;color:#5b4b3a}
.nav{margin-top:16px;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.btn{background:var(--wine);color:#fff;border:0;border-radius:999px;padding:11px 24px;font:inherit;font-weight:700;cursor:pointer}
.btn.alt{background:#fff;color:var(--wine);border:2px solid var(--wine)}
.btn:disabled{opacity:.4;cursor:default}
.hero{text-align:center}
.hero .big{font-size:3.2rem}
.hero input{font:inherit;padding:10px 14px;border-radius:12px;border:2px solid var(--line);width:min(320px,100%);margin:8px 0 14px}
.flags{font-size:1.5rem;letter-spacing:.2em}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.pair{background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;text-align:left;cursor:pointer;color:inherit}
.pair.on{border-color:#1b6ac9;background:#eaf2fd}
.pair.done{border-color:var(--green);background:#eaf6ee;cursor:default}
.pair.shake{animation:sh .3s;border-color:var(--red)}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.scorebar{display:flex;align-items:center;gap:10px;margin:6px 0}
.scorebar .name{width:200px;font-size:.88rem}
.scorebar .bar{flex:1;height:12px;background:#f0e2c8;border-radius:99px;overflow:hidden}
.scorebar .bar i{display:block;height:100%;background:var(--green)}
.rank{font-size:1.6rem;font-family:Georgia,serif;color:var(--wine)}
.safe{border-radius:12px;padding:12px 14px;margin:14px 0;background:#eaf6ee;border-left:6px solid var(--green)}
.safe.warn{background:#fdecea;border-color:var(--red)}
.phr h3{margin:.9em 0 .2em;font-size:1rem;color:var(--wine)}
.phr li{margin:.25em 0}
dialog{border:0;border-radius:18px;max-width:760px;width:calc(100% - 24px);padding:0;box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(40,20,10,.55)}
.dh{display:flex;justify-content:space-between;align-items:center;background:var(--wine);color:#fff;padding:12px 18px}
.dh h2{color:#fff;margin:0}
.dh button{background:transparent;border:0;color:#fff;font-size:1.6rem;cursor:pointer}
.db{padding:14px 18px;max-height:70vh;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--wine)}
.tag{display:inline-block;background:#f6e8cd;border-radius:99px;padding:1px 9px;margin:1px 2px 1px 0;font-size:.78rem}
.tag.v{background:#dff1e4}.tag.al{background:#fde1dd}
.sub{color:#7a6650;font-size:.9rem}
.spk{flex:none;background:#fff;border:2px solid var(--line);border-radius:50%;width:42px;height:42px;font-size:1.05rem;cursor:pointer;align-self:center;line-height:1}
.spk:hover{border-color:var(--saffron)}.spk:focus-visible{outline:3px solid #1b6ac9;outline-offset:2px}
.spk.sm{width:30px;height:30px;font-size:.85rem;vertical-align:middle;margin-left:4px}
.optrow{display:flex;gap:8px;align-items:stretch}.optrow .opt{flex:1}
.topnav{margin-bottom:8px}.link{background:none;border:0;color:var(--wine);font:inherit;font-size:.9rem;cursor:pointer;text-decoration:underline;padding:4px 0}
.mbtn .st{display:block;font-weight:700;color:#5b4b3a}.mbtn .go{flex:none;background:var(--wine);color:#fff;border-radius:999px;padding:6px 16px;font-weight:700;font-size:.85rem}
.mlist{display:grid;gap:10px;margin:14px 0;text-align:left}
.mbtn{display:flex;gap:12px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px;font:inherit;cursor:pointer;color:inherit;width:100%;text-align:left}
.mbtn:hover{border-color:var(--saffron)}.mbtn b{display:block}.mbtn .e{font-size:1.7rem}
@media(max-width:620px){.match{grid-template-columns:1fr}.scorebar .name{width:110px}body{font-size:17px}}
@media print{header,.nav,.noprint,.spk{display:none!important}body{background:#fff}.card{box-shadow:none;border:0}}
</style>
</head>
<body>
<header>
  <h1>Maison Masala<small>Restaurant English · French &amp; Indian cuisine</small></h1>
  <div class="tools">
    <button id="bMiss" type="button">🗺️ Missions</button>
    <button id="bMenu" type="button">📖 Menu card</button>

</header>
<main id="view"></main>
<dialog id="dlg"><div class="dh"><h2>Our menu card</h2><button type="button" id="dx" aria-label="Close">×</button></div><div class="db" id="dbody"></div></dialog>

<script>

/* ---------- MENU (fictional allergen information, used in the game) ---------- */
var MENU=[
 {n:"Soupe à l'oignon",c:"🇫🇷",cat:"Starter",d:"onion soup with melted cheese on toasted bread",x:["milk","gluten","beef stock"]},

function menu(n){return MENU.filter(function(m){return m.n===n})[0]}

/* ---------- MISSIONS ---------- */
// choice options: [text, points(0-3), feedback, risky?]
var MISSIONS=[
{title:"Mission 1 · Front of house",emoji:"🛎️",intro:"You are the waiter. Welcome the guests, make them feel at home and help them choose a dish.",scenes:[
 {who:"Guest",e:"🧑",say:"Good evening. Do you have a table for two? We don't have a reservation.",no:"God kveld. Har dere et bord for to? Vi har ikke bestilt bord.",o:[
  ["Good evening, and welcome to Maison Masala! Yes, we have a table by the window. Please follow me.",3,"Warm, polite and helpful. You greet, answer the question and guide the guests."],
  ["Good evening. Yes, a table for two. This way.",2,"Correct, but a little cold. Add “welcome” and a friendly offer."],
  ["No reservation? Let me check if we have space.",1,"Checking is fine, but it sounds unfriendly. Start with a greeting and a smile."],
  ["You must book a table first. Come back tomorrow.",0,"Too direct and rude. A guest should feel welcome."]]},
 {who:"Guest",e:"🧑",say:"This is our first time here. What do you recommend?",no:"Dette er første gang vi er her. Hva anbefaler du?",o:[
  ["Our butter chicken is very popular. It is creamy and mild. If you prefer French food, I recommend the coq au vin. It is chicken cooked slowly in red wine.",3,"Excellent. You give a reason, describe the dishes and offer a choice."],
  ["Try the butter chicken.",1,"Too short. Say why, and describe the dish."],
  ["Everything is good. Take what you like.",1,"Not helpful. A good waiter makes a clear recommendation."],
  ["The most expensive dish is the best.",0,"Pushy, and not true. Recommend dishes the guest will enjoy."]]},
 {who:"Guest",e:"🧑",say:"Is the butter chicken very spicy?",no:"Er butter chicken veldig sterk?",o:[
  ["It is mild and creamy, not very spicy. If you like, I can ask the chef to make it a bit spicier.",3,"Clear answer and a helpful offer."],
  ["It's mild. Would you like it spicy?",2,"Good, but add a little more information about the sauce."],
  ["No.",1,"Too short. Give more information."],
  ["Yes, very spicy. You won't like it.",0,"This is wrong, and you cannot decide what the guest likes."]]}
]},
{title:"Mission 2 · Know your menu",emoji:"📖",intro:"A good waiter knows every dish. Match the dishes to their descriptions. Use the Menu card at the top if you need help.",scenes:[
 {match:["Coq au vin","Ratatouille","Crème brûlée","Soupe à l'oignon","Butter chicken","Palak paneer","Chicken biryani","Mango lassi"]}
]},
{title:"Mission 3 · Allergies and special diets",emoji:"⚠️",intro:"Safety first. Guests trust you with their health. Use the Menu card to check what is in each dish. If you don't know, say so and ask.",scenes:[
 {who:"Guest",e:"🧑",say:"I'm allergic to nuts. Is the chicken korma safe for me?",no:"Jeg har nøtteallergi. Er chicken korma trygg for meg?",o:[
  ["I'm sorry, the chicken korma contains cashew nuts, so it isn't safe for you. I can recommend the palak paneer or the coq au vin instead. I will also tell the chef about your allergy.",3,"Perfect. You say the ingredient, give alternatives and inform the kitchen."],
  ["Let me ask the chef.",2,"Safe, but the menu card already tells you: it contains cashew nuts. Tell the guest and offer alternatives."],
  ["I think it's fine, but I'm not sure.",1,"Dangerous. Never guess about allergies.",true],
  ["Yes, it's fine. Everybody likes it.",0,"Very dangerous! The korma contains cashew nuts.",true]]},

  ["We have several vegetarian dishes: palak paneer, ratatouille and dal tadka. Please note that the onion soup is made with beef stock, so it is not vegetarian.",3,"Great. You name dishes and warn about a hidden ingredient."],
  ["Anything without meat. Just ask the chef.",1,"Not helpful. You should know the vegetarian dishes."],
  ["Only salad.",1,"We don't have a salad on the menu, and there are many vegetarian options."],
  ["The onion soup is vegetarian, and so is the ratatouille.",0,"The onion soup is made with beef stock, so it is not vegetarian.",true]]},
 {who:"Guest",e:"🧑",say:"I don't eat pork. Do the croque monsieur or the coq au vin have pork in them?",no:"Jeg spiser ikke svinekjøtt. Inneholder croque monsieur eller coq au vin svinekjøtt?",o:[
  ["Yes, both contain pork: ham in the croque monsieur and bacon in the coq au vin. The butter chicken and the biryani have no pork.",3,"Clear and complete, with alternatives."],
  ["Yes, I think so. I will ask the chef.",2,"Good that you offer to check, but the menu card gives the answer."],
  ["No, only chicken.",1,"Wrong. The coq au vin has bacon.",true],
  ["No, there is no pork in any of our dishes.",0,"Wrong. There is ham in the croque monsieur and bacon in the coq au vin.",true]]},
 {who:"Guest",e:"🧑",say:"I can't eat gluten. Can I have naan with my dish?",no:"Jeg tåler ikke gluten. Kan jeg få naan til retten min?",o:[
  ["I'm sorry, naan is made with wheat flour, so it contains gluten. You can have basmati rice instead. It is gluten-free.",3,"Honest and helpful. You explain why and offer an alternative."],
  ["Let me check with the chef.",2,"Safe, but the menu card shows that naan contains gluten."],
  ["Maybe. Try a small piece.",0,"Dangerous advice. Never suggest that a guest tries something.",true],
  ["Yes, of course.",0,"Naan contains gluten.",true]]},
 {who:"Guest",e:"🧑",say:"Is your chicken halal?",no:"Er kyllingen deres halal?",o:[
  ["I'm not sure. I will ask the manager and come back to you in a minute.",3,"Honest. It is better to say “I don't know” and find out than to guess."],
  ["I'm not sure. Maybe you can ask someone else.",1,"You should help the guest find the answer yourself."],
  ["Yes, of course.",0,"You don't know this, so you can't promise it. Never make up information.",true],
  ["What is halal?",0,"Learn the basic words of your workplace. Halal means food that is allowed in Islam."]]}
]},
{title:"Mission 4 · Taking the order and solving problems",emoji:"🍽️",intro:"Take the order correctly, handle complaints calmly and keep the guests happy.",scenes:[
 {who:"Guest",e:"🧑",say:"Okay, I'd like the butter chicken, mild, with naan and a mango lassi. And my wife will have the coq au vin and a glass of water.",no:"Greit, jeg tar butter chicken, mild, med naan og en mango lassi. Og kona mi tar coq au vin og et glass vann.",q:"How do you check the order?",o:[
  ["So that's one butter chicken, mild, with naan and a mango lassi, and one coq au vin with a glass of water. Is that correct?",3,"Excellent. You repeat every detail and check."],
  ["One butter chicken, one coq au vin, naan and drinks. Anything else?",2,"Good, but repeat the details (mild, mango lassi, water) to avoid mistakes."],
  ["OK.",1,"Too short. How do you remember everything?"],
  ["Butter chicken, spicy, and two coq au vin.",0,"Several mistakes. Listen carefully and repeat the order."]]},
 {who:"Guest",e:"🧑",say:"Excuse me, my soup is cold.",no:"Unnskyld, suppen min er kald.",q:"How do you handle the complaint?",o:[
  ["I'm so sorry about that. I'll take it back to the kitchen and bring you a hot one right away.",3,"Apologise, take action and give a time."],
  ["I'm sorry. Do you want another soup?",2,"Polite, but say what you will do."],
  ["The kitchen is very busy tonight.",1,"An excuse is not a solution."],
  ["It was hot when it left the kitchen.",0,"Never blame the guest. Apologise and solve the problem."]]},
 {who:"Guest",e:"🧑",say:"That was delicious, thank you!",no:"Dette var nydelig, tusen takk!",q:"What do you say?",o:[
  ["Thank you, I'm glad you enjoyed it! Would you like coffee or dessert? We have crème brûlée and gulab jamun.",3,"Friendly, and you suggest something extra."],
  ["Thank you. Would you like anything else?",2,"Polite. Name some options to make it easier."],

  ["It's my job.",0,"Sounds unfriendly. Accept the compliment with a smile."]]}
]},

 {who:"Chef",e:"👨‍🍳",say:"Order for table 4! Two onion soups, one without croutons. The guest has a gluten allergy. Clean board and clean knife, please!",no:"Bestilling til bord 4! To løksupper, en uten krutonger. Gjesten har glutenallergi. Rent brett og ren kniv, takk!",q:"How do you answer the chef?",o:[
  ["Yes, chef! Table 4: two onion soups, one without croutons because of a gluten allergy. I will use a clean board and a clean knife.",3,"Excellent. You repeat the order and the safety action."],

  ["OK.",1,"Too short in a noisy kitchen. Repeat the order."],
  ["Croutons are tiny. It won't matter.",0,"Never ignore an allergy. Even small amounts can be dangerous.",true]]},
 {who:"Situation",e:"🔥",say:"You are carrying a hot pan behind a colleague, and there is not much space.",no:"Du bærer en varm panne bak en kollega, og det er lite plass.",q:"What do you say?",o:[
  ["Behind! Hot pan!",3,"Short, clear and loud. This is the standard warning in a professional kitchen."],
  ["Excuse me.",2,"Polite, but it doesn't warn about the danger."],
  ["Move!",1,"Clear, but rude, and it doesn't say what is dangerous."],
  ["(Say nothing and walk past.)",0,"Dangerous. Your colleague can't see or hear you.",true]]},
 {who:"Chef",e:"👨‍🍳",say:"Do the mise en place for the lunch rush, and make sure the walk-in is sorted before the delivery arrives!",no:"Gjør mise en place klar til lunsjrushet, og sørg for at kjølerommet er ryddet før leveransen kommer!",q:"You don't understand everything the chef said. What do you say?",o:[
  ["Sorry, chef, could you repeat that, please? I want to be sure I do it correctly.",3,"Asking is professional. It prevents mistakes."],
  ["Sorry, what? I didn't understand.",2,"Okay, but be more polite and say what you want to do."],
  ["(Nod and guess what to do.)",0,"Guessing in a kitchen leads to mistakes. Always ask."],
  ["Yes, chef.",1,"Never say yes if you don't understand."]]}
]}
];

/* ---------- sound (the browser's built-in text-to-speech) ---------- */
var synth=window.speechSynthesis,auto=false,slow=false,voices=[];
function ea(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function loadVoices(){try{if(synth)voices=synth.getVoices()||[]}catch(e){}}
if(synth){loadVoices();if(synth.addEventListener)synth.addEventListener("voiceschanged",loadVoices);else synth.onvoiceschanged=loadVoices}
function voiceFor(lang){
  var pre=lang.slice(0,2).toLowerCase();
  var c=voices.filter(function(v){return v.lang&&v.lang.toLowerCase().indexOf(pre)===0});
  if(!c.length)return null;
  var exact=c.filter(function(v){return v.lang.replace("_","-").toLowerCase()===lang.toLowerCase()});
  var pool=exact.length?exact:c;
  var good=pool.filter(function(v){return /natural|online|google|premium|enhanced/i.test(v.name)});
  return good[0]||pool[0];
}
function speak(text,lang){
  if(!synth||!text)return;lang=lang||"en-GB";
  try{
    synth.cancel();
    var u=new SpeechSynthesisUtterance(String(text));u.lang=lang;
    var v=voiceFor(lang);if(!v&&lang.indexOf("en")===0)v=voiceFor("en-GB");
    if(v)u.voice=v;u.rate=slow?0.7:0.92;synth.speak(u);
  }catch(e){}
}
document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("[data-say]");if(b)speak(b.dataset.say,b.dataset.lang)});

/* ---------- state ---------- */
var st,M;
function blank(){return{p:0,max:0,idx:0,started:false,risky:[]}}
function fresh(name){st={name:name||""};M=MISSIONS.map(blank)}
fresh();
var QT=MISSIONS.reduce(function(a,m){return a+m.scenes.length},0);

function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function totals(){var p=0,max=0;M.forEach(function(x){p+=x.p;max+=x.max});return{p:p,max:max}}
function qDone(){return M.reduce(function(a,x){return a+x.idx},0)}
function isDone(mi){return M[mi].idx>=MISSIONS[mi].scenes.length}
function go(){window.scrollTo(0,0);try{if(synth)synth.cancel()}catch(e){}}
function topnav(){return'<div class="topnav noprint"><button class="link" id="back" type="button">‹ All missions</button></div>'}
function wireBack(){var b=$("#back");if(b)b.onclick=showHub}
function bar(mi){
  var n=MISSIONS[mi].scenes.length,k=M[mi].idx;
  return'<div class="progress" aria-hidden="true"><i style="width:'+Math.round(100*k/n)+'%"></i></div><div class="meta"><span>Mission '+(mi+1)+' · Question '+Math.min(k+1,n)+' of '+n+'</span><span>⭐ '+totals().p+' points</span></div>';
}

/* ---------- start + hub ---------- */
function showStart(){
  go();
  view.innerHTML='<section class="card hero"><div class="big">🍛🥐</div><h2>Welcome to Maison Masala</h2>'+
   '<p class="flags">🇫🇷 🇮🇳</p>'+
   '<p>Oslo\'s favourite restaurant for French and Indian cuisine. It is your first day at work. Can you help our guests in English?</p>'+
   '<p class="sub">5 missions · about 20 minutes · play alone or in pairs, in any order. After every question, <b>say the best answer out loud</b>.</p>'+
   '<label for="nm" class="sub">Your name (for your result)</label><br><input id="nm" autocomplete="off" placeholder="Type your name"><br>'+
   '<button class="btn" id="go" type="button">Start my shift</button></section>';
  $("#nm").oninput=function(){st.name=this.value.trim()};
  $("#go").onclick=function(){st.name=$("#nm").value.trim();showHub()};
}

function showHub(){
  go();
  var t=totals(),done=0;MISSIONS.forEach(function(m,i){if(isDone(i))done++});
  view.innerHTML='<section class="card"><h2>'+(st.name?esc(st.name)+", choose":"Choose")+' a mission</h2><p class="sub">Play the missions in any order. You can leave a mission and come back later. Your points are saved while this page is open.</p>'+
   '<div class="progress" aria-hidden="true"><i style="width:'+Math.round(100*qDone()/QT)+'%"></i></div><div class="meta"><span>'+done+' of '+MISSIONS.length+' missions finished</span><span>⭐ '+t.p+' points</span></div>'+
   '<div class="mlist" id="ml"></div><div class="nav" style="justify-content:center"><button class="btn alt" id="res" type="button">See my result</button></div></section>';
  var box=$("#ml");
  MISSIONS.forEach(function(m,mi){
    var s=M[mi],n=m.scenes.length,fin=isDone(mi);
    var status=fin?"✅ Finished · "+s.p+"/"+s.max+" points":s.idx>0?"In progress · "+s.idx+" of "+n+" answered":"Not started";
    var b=document.createElement("button");b.type="button";b.className="mbtn";
    b.innerHTML='<span class="e">'+m.emoji+'</span><span style="flex:1"><b>'+esc(m.title)+'</b><span class="sub">'+esc(m.intro)+'</span><span class="sub st">'+status+'</span></span><span class="go">'+(fin?"Replay":s.idx>0?"Continue":"Start")+'</span>';
    b.onclick=function(){if(fin)M[mi]=blank();openMission(mi)};
    box.appendChild(b);
  });
  $("#res").onclick=summary;
}

/* ---------- mission flow ---------- */
function openMission(mi){
  var s=M[mi],sc=MISSIONS[mi].scenes;
  if(s.idx>=sc.length)return missionDone(mi);
  if(s.idx===0&&!s.started){s.started=true;return intro(mi)}
  playScene(mi);
}
function intro(mi){
  go();var m=MISSIONS[mi];
  view.innerHTML=topnav()+'<section class="card hero"><div class="big">'+m.emoji+'</div><div class="mission">'+esc(m.title)+'</div><p>'+esc(m.intro)+'</p><div class="nav" style="justify-content:center"><button class="btn" id="n" type="button">Let\'s go</button></div></section>';
  wireBack();$("#n").onclick=function(){playScene(mi)};$("#n").focus();
}
function playScene(mi){
  go();var sc=MISSIONS[mi].scenes[M[mi].idx];
  if(sc.match)match(mi,sc);else choice(mi,sc);
}

function choice(mi,sc){
  var s=M[mi],mt=MISSIONS[mi].title,n=MISSIONS[mi].scenes.length;
  var opts=shuffle(sc.o.map(function(o){return{t:o[0],p:o[1],f:o[2],r:!!o[3]}}));
  var best=opts.filter(function(o){return o.p===3})[0];
  view.innerHTML=topnav()+bar(mi)+'<section class="card"><div class="mission">'+esc(mt)+'</div>'+
   '<div class="bubble"><span class="av" aria-hidden="true">'+sc.e+'</span><div><div class="who">'+sc.who+' <button type="button" class="spk sm" data-say="'+ea(sc.say)+'" aria-label="Listen to the sentence" title="Listen">🔊</button></div><p class="say">'+esc(sc.say)+'</p><p class="no">🇳🇴 '+esc(sc.no||"")+'</p></div></div>'+
   '<p class="prompt">'+esc(sc.q||"What do you say?")+'</p><div class="opts" id="opts"></div><div class="fb" id="fb" aria-live="polite"></div><div class="nav" id="nav"></div></section>';
  wireBack();
  var box=$("#opts");
  opts.forEach(function(o,i){
    var b=document.createElement("button");b.type="button";b.className="opt";
    b.innerHTML='<span class="l">'+"ABCD"[i]+'</span><span>'+esc(o.t)+'</span>';
    b.onclick=function(){
      var btns=box.querySelectorAll(".opt");
      btns.forEach(function(x,j){x.disabled=true;if(opts[j]===best)x.classList.add("best")});
      b.classList.add("sel",o.p===3?"good":o.p>=1?"mid":"bad");
      s.p+=o.p;s.max+=3;s.idx++;
      if(o.r)s.risky.push({say:sc.say,best:best.t});
      var fb=$("#fb");fb.className="fb show "+(o.p===3?"good":o.p===0?"bad":"");
      fb.innerHTML='<span class="pts">+'+o.p+' point'+(o.p===1?"":"s")+'</span> · '+esc(o.f)+
        (o.p<3?'<br><b>Best answer:</b> '+esc(best.t):'')+' <button type="button" class="spk sm" data-say="'+ea(best.t)+'" aria-label="Listen to the best answer" title="Listen to the best answer">🔊</button>'+
        '<div class="say-aloud">🗣️ Now say the best answer out loud to your partner.</div>';
      if(auto)speak(best.t);
      var nb=document.createElement("button");nb.className="btn";nb.type="button";nb.textContent=s.idx>=n?"Finish mission":"Next";
      nb.onclick=function(){openMission(mi)};$("#nav").appendChild(nb);nb.focus();
    };
    var row=document.createElement("div");row.className="optrow";row.appendChild(b);
    var sp=document.createElement("button");sp.type="button";sp.className="spk";sp.setAttribute("aria-label","Listen to this answer");sp.title="Listen";sp.textContent="🔊";sp.dataset.say=o.t;row.appendChild(sp);
    box.appendChild(row);
  });
  if(auto)speak(sc.say);
}

function match(mi,sc){
  var s=M[mi],names=sc.match,left=shuffle(names),right=shuffle(names),sel=null,done=0,wrong={},pts=0,max=names.length*2,n=MISSIONS[mi].scenes.length;
  view.innerHTML=topnav()+bar(mi)+'<section class="card"><div class="mission">'+esc(MISSIONS[mi].title)+'</div><h2>Match the dish to the description</h2><p class="sub">Tap a dish, then tap its description.</p><div class="match" id="m"></div><div class="fb" id="fb" aria-live="polite"></div><div class="nav" id="nav"></div></section>';
  wireBack();
  var m=$("#m");
  var L=left.map(function(x){var b=document.createElement("button");b.type="button";b.className="pair";b.dataset.n=x;b.textContent=menu(x).c+" "+x;return b});
  var R=right.map(function(x){var b=document.createElement("button");b.type="button";b.className="pair";b.dataset.n=x;b.textContent=menu(x).d.charAt(0).toUpperCase()+menu(x).d.slice(1);return b});
  var cl=document.createElement("div"),cr=document.createElement("div");cl.style.display=cr.style.display="grid";cl.style.gap=cr.style.gap="10px";
  L.forEach(function(b){cl.appendChild(b)});R.forEach(function(b){cr.appendChild(b)});m.appendChild(cl);m.appendChild(cr);
  L.forEach(function(b){b.onclick=function(){if(b.classList.contains("done"))return;L.forEach(function(x){x.classList.remove("on")});b.classList.add("on");sel=b;if(auto)speak(b.dataset.n,menu(b.dataset.n).c==="🇫🇷"?"fr-FR":"en-IN")}});
  R.forEach(function(b){b.onclick=function(){
    if(b.classList.contains("done")||!sel)return;
    if(sel.dataset.n===b.dataset.n){
      pts+=wrong[b.dataset.n]?1:2;done++;if(auto)speak(menu(b.dataset.n).d);sel.classList.remove("on");sel.classList.add("done");b.classList.add("done");sel=null;
      if(done===names.length){
        s.p+=pts;s.max+=max;s.idx++;
        var fb=$("#fb");fb.className="fb show good";fb.innerHTML='<span class="pts">+'+pts+' of '+max+' points</span> · Great! You know the menu. Now say each dish name and describe it in your own words.';
        var nb=document.createElement("button");nb.className="btn";nb.type="button";nb.textContent=s.idx>=n?"Finish mission":"Next";nb.onclick=function(){openMission(mi)};$("#nav").appendChild(nb);nb.focus();
      }
    }else{
      wrong[sel.dataset.n]=1;b.classList.add("shake");sel.classList.add("shake");
      var a=sel;setTimeout(function(){b.classList.remove("shake");a.classList.remove("shake")},350);
    }
  }});
}

function riskBlock(list,intro){
  return'<div class="safe warn"><b>⚠️ Safety check: '+list.length+' risky answer'+(list.length>1?"s":"")+'.</b> '+intro+'<ul>'+list.map(function(x){return'<li>Guest: “'+esc(x.say)+'”<br><b>Better:</b> '+esc(x.best)+'</li>'}).join("")+'</ul></div>';
}
function missionDone(mi){
  go();var m=MISSIONS[mi],s=M[mi];
  var hasRisk=m.scenes.some(function(x){return x.o&&x.o.some(function(o){return o[3]})});
  var safe=!hasRisk?"":(s.risky.length?riskBlock(s.risky,"In a real restaurant these answers can hurt a guest. Study these:"):'<div class="safe"><b>✅ Safety check passed.</b> You never gave risky information in this mission.</div>');
  var nextMi=mi+1<MISSIONS.length?mi+1:-1;
  view.innerHTML=topnav()+'<section class="card hero"><div class="big">'+m.emoji+'</div><div class="mission">'+esc(m.title)+'</div><h2>Mission complete!</h2><p><b>'+s.p+' / '+s.max+' points</b></p><div style="text-align:left">'+safe+'</div>'+
   '<div class="nav" style="justify-content:center"><button class="btn alt" id="rp" type="button">Replay this mission</button><button class="btn alt" id="hub" type="button">All missions</button><button class="btn" id="nx" type="button">'+(nextMi>=0?"Next mission ›":"See my result")+'</button></div></section>';
  wireBack();
  $("#rp").onclick=function(){M[mi]=blank();openMission(mi)};
  $("#hub").onclick=showHub;
  $("#nx").onclick=function(){if(nextMi>=0)openMission(nextMi);else summary()};
}

/* ---------- result ---------- */
function rank(p){
  if(p>=85)return["Maître d'","⭐⭐⭐","Excellent! You are ready to welcome guests from all over the world."];
  if(p>=65)return["Chef de rang","⭐⭐","Very good! A few phrases to polish and you will be a star."];
  if(p>=40)return["Commis (trainee)","⭐","Good start! Read the best answers again and try once more."];
  return["First-day trainee","🌱","Everyone starts somewhere. Study the phrases below and play again."];
}
function summary(){
  go();var t=totals(),pct=t.max?Math.round(100*t.p/t.max):0,r=rank(pct);
  var finished=0;MISSIONS.forEach(function(m,i){if(isDone(i))finished++});
  var per=MISSIONS.map(function(m,i){var p=M[i];var w=p.max?Math.round(100*p.p/p.max):0;
    return'<div class="scorebar"><span class="name">'+esc(m.title.replace("Mission ","M"))+'</span><span class="bar"><i style="width:'+w+'%"></i></span><span>'+(p.idx?p.p+'/'+p.max:"–")+'</span></div>'}).join("");
  var risky=[];M.forEach(function(s){risky=risky.concat(s.risky)});
  var safe=risky.length?riskBlock(risky,"In a real restaurant these answers can hurt a guest. Study these:"):(finished?'<div class="safe"><b>✅ Safety check passed.</b> You never gave risky information about allergies or ingredients.</div>':'');
  var note=finished<MISSIONS.length?'<p class="sub noprint">You have finished '+finished+' of '+MISSIONS.length+' missions. Go back and play the rest to improve your result.</p>':"";
  var phr=MISSIONS.map(function(m){
    var items=m.scenes.filter(function(s){return s.o}).map(function(s){var b=s.o.filter(function(o){return o[1]===3})[0];return'<li>'+esc(b[0])+' <button type="button" class="spk sm noprint" data-say="'+ea(b[0])+'" aria-label="Listen" title="Listen">🔊</button></li>'}).join("");
    return items?'<h3>'+esc(m.title)+'</h3><ul>'+items+'</ul>':"";
  }).join("");
  view.innerHTML='<section class="card hero"><div class="big">🏅</div><h2>'+(st.name?esc(st.name)+", your":"Your")+' result</h2>'+
   (t.max?'<div class="rank">'+r[0]+' '+r[1]+'</div><p><b>'+t.p+' / '+t.max+' points ('+pct+'%)</b></p><p>'+r[2]+'</p>':'<p>You have not answered any questions yet. Choose a mission to begin.</p>')+note+
   '<div style="text-align:left">'+per+safe+'<div class="phr"><h2>Your phrasebank</h2><p class="sub">The best answers from this game. Practise them with a partner.</p>'+phr+'</div></div>'+
   '<div class="nav" style="justify-content:center"><button class="btn alt" id="pr" type="button">Print or save as PDF</button><button class="btn alt" id="hub" type="button">All missions</button><button class="btn" id="again" type="button">Start again</button></div></section>';
  $("#pr").onclick=function(){window.print()};
  $("#hub").onclick=showHub;
  $("#again").onclick=function(){fresh(st.name);showHub()};
}

/* ---------- menu dialog + toggles ---------- */
function menuHtml(){
  var rows=MENU.map(function(m){
    var tags=(m.v?'<span class="tag v">vegetarian</span>':'')+m.x.map(function(x){return'<span class="tag al">'+esc(x)+'</span>'}).join("");
    return'<tr><td>'+m.c+' <b>'+esc(m.n)+'</b> <button type="button" class="spk sm" data-say="'+ea(m.n)+'" data-lang="'+(m.c==="🇫🇷"?"fr-FR":"en-IN")+'" aria-label="Listen to the name" title="Listen to the name">🔊</button><br><span class="sub">'+m.cat+'</span></td><td>'+esc(m.d)+' <button type="button" class="spk sm" data-say="'+ea(m.d)+'" aria-label="Listen to the description" title="Listen to the description">🔊</button></td><td>'+(tags||'<span class="sub">–</span>')+'</td></tr>';
  }).join("");
  return'<p class="sub">Red tags show what a dish contains. This menu is fictional and made for this game.</p><table><thead><tr><th>Dish</th><th>Description</th><th>Contains</th></tr></thead><tbody>'+rows+'</tbody></table>';
}
$("#dbody").innerHTML=menuHtml();
var dlg=$("#dlg");
$("#bMenu").onclick=function(){if(dlg.showModal)dlg.showModal();else dlg.setAttribute("open","")};
$("#bMiss").onclick=function(){showHub()};
$("#dx").onclick=function(){dlg.close?dlg.close():dlg.removeAttribute("open")};
function toggle(id,cls,key){
  var b=$(id);
  function set(on){document.body.classList.toggle(cls,on);b.setAttribute("aria-pressed",String(on));try{localStorage.setItem(key,on?"1":"0")}catch(e){}}
  var saved=false;try{saved=localStorage.getItem(key)==="1"}catch(e){}
  set(saved);b.onclick=function(){set(!document.body.classList.contains(cls))};
}
toggle("#bHint","hint","mm_hint");toggle("#bEasy","easy","mm_easy");
function flag(id,key,fn){
  var b=$(id);
  function set(on){fn(on);b.setAttribute("aria-pressed",String(on));try{localStorage.setItem(key,on?"1":"0")}catch(e){}}
  var saved=false;try{saved=localStorage.getItem(key)==="1"}catch(e){}
  set(saved);b.onclick=function(){var on=b.getAttribute("aria-pressed")!=="true";set(on);if(on&&id==="#bAuto")speak("Auto-read is on.")};
}
if(!synth){$("#bAuto").style.display="none";$("#bSlow").style.display="none"}
else{
  flag("#bAuto","mm_auto",function(on){auto=on;if(!on){try{synth.cancel()}catch(e){}}});
  flag("#bSlow","mm_slow",function(on){slow=on});
}
showStart();
})();
</script>
</body>
</html>
